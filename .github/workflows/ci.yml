name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  id-token: write
  contents: write
  pull-requests: write

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            site/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Install web dependencies
        run: cd web && npm ci

      - name: Lint
        run: cd web && npm run lint

      - name: Test with coverage
        run: cd web && npm run test:coverage

      - name: Upload frontend coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: web/coverage/lcov.info
          flags: frontend
          fail_ci_if_error: true

      - name: Build web assets
        run: cd web && npm run build && npm run build:export

      - name: Go vet
        run: go vet ./...

      - name: Go tests
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Upload Go coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.out
          flags: backend
          fail_ci_if_error: true

      - name: Generate Go coverage HTML
        run: go tool cover -html=coverage.out -o go-coverage.html

      - name: Build Go binary
        run: |
          BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          go build -ldflags "-X main.version=ci-${GITHUB_SHA::7} -X main.branch=${BRANCH}" -o claude-chronicle ./cmd/chronicle

      - name: Smoke test
        run: ./claude-chronicle version

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: claude-chronicle-linux
          path: claude-chronicle
          retention-days: 7

      - name: Determine output paths
        id: paths
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            DIR="pr-${{ github.event.pull_request.number }}"
            echo "dir=${DIR}" >> "$GITHUB_OUTPUT"
            echo "url=https://jgbright.github.io/claude-chronicle/${DIR}/" >> "$GITHUB_OUTPUT"
          else
            SHORT_SHA="${GITHUB_SHA::7}"
            DIR="${SHORT_SHA}"
            echo "dir=${DIR}" >> "$GITHUB_OUTPUT"
            echo "url=https://jgbright.github.io/claude-chronicle/" >> "$GITHUB_OUTPUT"
            echo "permalink=https://jgbright.github.io/claude-chronicle/${DIR}/" >> "$GITHUB_OUTPUT"
          fi

      - name: Export demo sessions
        run: |
          mkdir -p "_site/${{ steps.paths.outputs.dir }}"
          ./claude-chronicle export -file samples/sample_session.jsonl -theme claude \
            -o "_site/${{ steps.paths.outputs.dir }}/demo.html"
          ./claude-chronicle export -file samples/sample_session.jsonl -theme copilot \
            -o "_site/${{ steps.paths.outputs.dir }}/demo-copilot.html"

      - name: Build Storybook
        working-directory: web
        run: npm run build-storybook

      - name: Install Playwright Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Capture Storybook screenshots
        working-directory: web
        run: npm run capture-screenshots

      - name: Generate screenshot gallery
        working-directory: web
        run: npm run generate-gallery

      - name: Capture showcase screenshots
        working-directory: web
        run: npm run capture-showcase
        env:
          SHOWCASE_CLAUDE_HTML: ${{ github.workspace }}/_site/${{ steps.paths.outputs.dir }}/demo.html
          SHOWCASE_COPILOT_HTML: ${{ github.workspace }}/_site/${{ steps.paths.outputs.dir }}/demo-copilot.html

      - name: Install site dependencies
        run: cd site && npm ci

      - name: Copy screenshots for Astro build
        run: |
          mkdir -p site/public/screenshots
          cp web/showcase/screenshots/*.jpg site/public/screenshots/ || true

      - name: Build landing site
        run: cd site && npm run build
        env:
          GITHUB_SHA: ${{ github.sha }}

      - name: Assemble _site
        run: |
          # Main pushes: deploy full site (landing page, demo, coverage, storybook)
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            cp -r site/dist/* _site/

            mkdir -p _site/demo
            cp "_site/${{ steps.paths.outputs.dir }}/demo.html" _site/demo/index.html

            mkdir -p _site/coverage/go _site/coverage/frontend
            cp go-coverage.html _site/coverage/go/index.html
            cp -r web/coverage/* _site/coverage/frontend/

            mkdir -p _site/storybook/screenshots
            cp web/gallery/index.html _site/storybook/index.html
            cp web/gallery/screenshots/*.png _site/storybook/screenshots/
          fi

          # Remove copilot export (only used for screenshots)
          rm -f "_site/${{ steps.paths.outputs.dir }}/demo-copilot.html"

      - name: Upload exported HTML
        uses: actions/upload-artifact@v4
        with:
          name: exported-html
          path: _site/${{ steps.paths.outputs.dir }}/demo.html

      - name: Deploy to GitHub Pages
        if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./_site
          keep_files: true

      - name: Write job summary
        if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
        run: |
          echo "### Deployed to GitHub Pages" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "${{ steps.paths.outputs.permalink }}" ]; then
            echo "**Latest:** ${{ steps.paths.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
            echo "**Permalink:** ${{ steps.paths.outputs.permalink }}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "**Preview:** ${{ steps.paths.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "**Directory:** \`${{ steps.paths.outputs.dir }}/\`" >> "$GITHUB_STEP_SUMMARY"
          echo "**Storybook:** https://jgbright.github.io/claude-chronicle/storybook/" >> "$GITHUB_STEP_SUMMARY"
          echo "**Coverage:** https://jgbright.github.io/claude-chronicle/coverage/frontend/" >> "$GITHUB_STEP_SUMMARY"

      - name: Comment on PR with preview URL
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const body = `### Pages Preview

            **Landing:** ${{ steps.paths.outputs.url }}
            **Demo:** ${{ steps.paths.outputs.url }}demo.html
            **Storybook:** https://jgbright.github.io/claude-chronicle/storybook/

            Built from ${context.sha.substring(0, 7)}`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('Pages Preview')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
